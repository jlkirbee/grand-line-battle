<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grand Line Battle — One Piece × Pokémon</title>
<style>
  :root{
    --ink:#20283a; --panel:#fbfbf3; --panel-edge:#3a4a63;
    --hp-green:#4cd07a; --hp-yellow:#f4c150; --hp-red:#e85c5c;
    --accent:#2a6df4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:#0c1018;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    width:min(96vw,820px);
    aspect-ratio:4/3;
    background:#11161f; position:relative;
    border-radius:14px; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 0 4px #1c2433;
    user-select:none;
  }
  .screen{position:absolute; inset:0; display:none;}
  .screen.active{display:block;}

  /* ---------- Title ---------- */
  #title{
    background:radial-gradient(120% 90% at 50% 0%,#3aa0ff 0%,#1f5fd0 45%,#13357a 100%);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff; gap:18px;
  }
  #title.active{display:flex;}
  #title h1{font-size:clamp(28px,6vw,54px); letter-spacing:1px; text-shadow:3px 3px 0 #0b2a66;}
  #title .sub{opacity:.92; font-size:clamp(13px,2.4vw,18px); max-width:80%;}
  .press{margin-top:10px; padding:14px 28px; font-size:18px; cursor:pointer;
    background:#ffd23f; color:#5a3b00; border:none; border-radius:10px; font-weight:bold;
    box-shadow:0 5px 0 #b88a00; transition:transform .06s;}
  .press:active{transform:translateY(3px); box-shadow:0 2px 0 #b88a00;}

  /* ---------- Select ---------- */
  #select{
    background:linear-gradient(160deg,#1a2b4a,#0e1726);
    padding:18px; color:#eaf0ff;
  }
  #select.active{ display:flex; flex-direction:column; }
  #select h2{text-align:center; font-size:clamp(16px,3vw,24px); margin-bottom:4px; color:#ffd23f;}
  #select p.hint{text-align:center; font-size:12px; opacity:.7; margin-bottom:12px;}
  .roster{
    flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:10px;
    overflow:auto;
  }
  @media (max-width:560px){ .roster{grid-template-columns:repeat(3,1fr);} }
  .card{
    background:#22304d; border:2px solid #34466b; border-radius:10px;
    display:flex; flex-direction:column; align-items:center; padding:8px 4px 6px;
    cursor:pointer; transition:transform .08s, border-color .08s, background .08s;
  }
  .card:hover{transform:translateY(-3px); border-color:#ffd23f; background:#2b3c61;}
  .card canvas{width:72px; height:72px; image-rendering:pixelated;}
  .card .nm{font-size:12px; font-weight:bold; margin-top:2px;}
  .card .role{font-size:9px; opacity:.6;}

  /* ---------- Battle ---------- */
  #battle{
    background:
      linear-gradient(180deg,#bfeaff 0%,#9fd9ff 38%,#d8f0c0 38%,#bfe49a 100%);
  }
  .field{position:absolute; inset:0;}
  .platform{position:absolute; height:5%; border-radius:50%;
    background:rgba(90,140,60,.45); filter:blur(1px);}
  .foe-plat{right:6%; top:46%; width:42%;}
  .me-plat{left:4%; bottom:20%; width:48%; height:7%;}

  .sprite{position:absolute; image-rendering:pixelated; transition:transform .25s, opacity .25s;}
  #foeSprite{right:9%; top:15%; width:34%;}
  #meSprite{left:7%; bottom:23%; width:38%; transform:scaleX(-1);}
  #fxCanvas{position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:20; image-rendering:pixelated;}
  .card.s-jjk{border-color:#6a4a8a;} .card.s-jjk:hover{border-color:#b07ad0;}
  .card.s-aot{border-color:#4a6a4a;} .card.s-aot:hover{border-color:#7ad07a;}
  .card .series{font-size:7px; opacity:.5; letter-spacing:.3px; text-transform:uppercase;}

  /* status plates */
  .plate{position:absolute; background:var(--panel); border:3px solid var(--panel-edge);
    border-radius:10px; padding:7px 10px 8px; width:42%; box-shadow:3px 3px 0 rgba(0,0,0,.18);}
  .foe-plate{left:4%; top:7%;}
  .me-plate{right:4%; bottom:33%;}
  .plate .row1{display:flex; justify-content:space-between; align-items:baseline;}
  .plate .pname{font-weight:bold; font-size:clamp(11px,2.2vw,15px);}
  .plate .lvl{font-size:11px; opacity:.7;}
  .hpwrap{margin-top:5px; display:flex; align-items:center; gap:6px;}
  .hpwrap .hp-label{font-size:10px; font-weight:bold; color:#d8a200;}
  .hpbar{flex:1; height:9px; background:#5a5a5a; border-radius:6px; overflow:hidden; border:1px solid #2a2a2a;}
  .hpfill{height:100%; width:100%; background:var(--hp-green); transition:width .5s ease, background .3s;}
  .hpnum{font-size:10px; text-align:right; margin-top:2px; opacity:.75;}

  /* bottom UI */
  .ui{position:absolute; left:0; right:0; bottom:0; height:30%; display:flex; gap:0;}
  .textbox{flex:1.25; margin:8px; background:var(--panel); border:4px solid var(--panel-edge);
    border-radius:12px; padding:14px 16px; font-size:clamp(13px,2.6vw,18px);
    line-height:1.45; display:flex; align-items:center;}
  .menu{flex:1; margin:8px 8px 8px 0; display:none; grid-template-columns:1fr 1fr; gap:8px;}
  .menu.show{display:grid;}
  .move{background:var(--panel); border:3px solid var(--panel-edge); border-radius:10px;
    cursor:pointer; font-weight:bold; font-size:clamp(11px,2.2vw,15px);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:4px;
    transition:background .08s, transform .06s;}
  .move:hover{background:#ffe9a8;}
  .move:active{transform:translateY(2px);}
  .move:disabled{opacity:.45; cursor:default; transform:none; background:var(--panel);}
  .move.locked{opacity:.5; font-style:italic; background:repeating-linear-gradient(
    45deg,#ece9dd,#ece9dd 6px,#e0ddd0 6px,#e0ddd0 12px); color:#6a6a5a;}
  @keyframes unlockGlow{
    0%,100%{ box-shadow:0 0 0 0 rgba(166,74,208,0); border-color:var(--panel-edge); }
    15%{ box-shadow:0 0 20px 7px rgba(166,74,208,.9); border-color:#c98be8; }
    35%{ box-shadow:0 0 5px 1px rgba(166,74,208,.3); border-color:var(--panel-edge); }
    55%{ box-shadow:0 0 20px 7px rgba(74,160,255,.85); border-color:#7fb6ff; }
    75%{ box-shadow:0 0 6px 1px rgba(166,74,208,.35); border-color:#c98be8; }
  }
  .move.unlock-glow{ animation:unlockGlow 1.6s ease-out; }

  .cursor-hint{position:absolute; bottom:6px; right:14px; font-size:11px; color:#fff;
    opacity:.6; pointer-events:none;}

  /* hit flash & shake */
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,2px)}
    40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}
  .shake{animation:shake .35s;}
  .meShake{animation:shake .35s;} /* applied via JS, keeps scaleX via wrapper */
  @keyframes flash{0%,100%{filter:none}50%{filter:brightness(2.5) saturate(.3)}}
  .flash{animation:flash .3s;}

  .toast{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(12,18,30,.92); color:#fff; padding:18px 30px; border-radius:14px;
    font-size:clamp(18px,4vw,30px); font-weight:bold; text-align:center; display:none;
    box-shadow:0 0 0 4px #ffd23f, 0 14px 40px rgba(0,0,0,.5);}
  .toast.show{display:block;}

  #muteBtn{position:absolute; top:10px; right:12px; z-index:50;
    width:36px; height:36px; border:none; border-radius:9px; cursor:pointer;
    background:rgba(12,18,30,.55); font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:background .12s, transform .06s;}
  #muteBtn:hover{background:rgba(12,18,30,.8);}
  #muteBtn:active{transform:scale(.92);}
</style>
</head>
<body>
<div id="stage">
  <button id="muteBtn" title="Toggle music">🔊</button>

  <!-- TITLE -->
  <div id="title" class="screen active">
    <h1>⚓ GRAND LINE BATTLE ⚓</h1>
    <div class="sub">A One Piece × Pokémon-style battle. Pick a Straw Hat, face a random rival, and duel turn-by-turn.</div>
    <button class="press" id="startBtn">▶ PRESS START</button>
  </div>

  <!-- SELECT -->
  <div id="select" class="screen">
    <h2>CHOOSE YOUR FIGHTER</h2>
    <p class="hint">Your pick battles a random rival from across the roster.</p>
    <div class="roster" id="roster"></div>
  </div>

  <!-- BATTLE -->
  <div id="battle" class="screen">
    <div class="field">
      <div class="platform foe-plat"></div>
      <div class="platform me-plat"></div>
      <canvas id="foeSprite" class="sprite"></canvas>
      <canvas id="meSprite" class="sprite"></canvas>
      <canvas id="fxCanvas"></canvas>

      <div class="plate foe-plate">
        <div class="row1"><span class="pname" id="foeName">FOE</span><span class="lvl">Lv50</span></div>
        <div class="hpwrap"><span class="hp-label">HP</span>
          <div class="hpbar"><div class="hpfill" id="foeHp"></div></div></div>
      </div>

      <div class="plate me-plate">
        <div class="row1"><span class="pname" id="meName">ME</span><span class="lvl">Lv50</span></div>
        <div class="hpwrap"><span class="hp-label">HP</span>
          <div class="hpbar"><div class="hpfill" id="meHp"></div></div></div>
        <div class="hpnum" id="meHpNum">100 / 100</div>
      </div>
    </div>

    <div class="ui">
      <div class="textbox" id="textbox">…</div>
      <div class="menu" id="menu"></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

</div>

/* ============================================================
   AUDIO  (tiny WebAudio blips — no asset files)
   ============================================================ */
let actx=null;
function ensureCtx(){
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==="suspended") actx.resume();
  return actx;
}
function beep(freq,dur,type="square",vol=.04){
  try{
    ensureCtx();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.value=vol; o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sfx={
  blip:()=>beep(620,.03,"square",.02),
  hit:()=>{beep(160,.12,"sawtooth",.06); },
  crit:()=>{beep(110,.18,"sawtooth",.07);},
  faint:()=>{beep(330,.12);setTimeout(()=>beep(247,.18),100);setTimeout(()=>beep(165,.3),240);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,"square",.05),i*120));},
  select:()=>beep(880,.06,"square",.04),
  // shimmer chime when a combo move (Hollow Purple) unlocks
  unlock:()=>{ [660,880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>{
    beep(f,.20,"triangle",.05); beep(f*1.5,.12,"sine",.022); }, i*70)); },
};

/* ============================================================
   CHIPTUNE MUSIC ENGINE  (Game Boy 4-channel style, no assets)
   Pulse lead + pulse harmony + triangle bass + noise drums.
   Track: an 8-bit interpretation of the One Piece OP "We Are!".
   ============================================================ */
function noteFreq(name){
  if(!name||name==="-") return 0;
  const m=/^([A-G])(#|b)?(\d)$/.exec(name);
  if(!m) return 0;
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
  const acc=m[2]==="#"?1:m[2]==="b"?-1:0;
  const midi=base+acc+(parseInt(m[3])+1)*12;
  return 440*Math.pow(2,(midi-69)/12);
}

// ---- the song: chiptune transcription of the One Piece OP1 hook ----
// D major, ~178bpm. Signature shape: fast repeated-note pickups that
// leap up into a sustained hook, then a stepwise descent. (Transcribed
// by ear from the melody's contour, not from a score.)
const SONG=(()=>{
  const lead=[
    // verse phrase 1 — driving repeated pickups, settle down
    ["A4",.5],["A4",.5],["A4",.5],["A4",.5],["B4",.5],["A4",.5],["F#4",1],
    // phrase 1 answer
    ["A4",.5],["A4",.5],["A4",.5],["B4",.5],["A4",.5],["F#4",.5],["E4",1],
    // phrase 2 — the rise to the hook
    ["F#4",.5],["A4",.5],["D5",1],["D5",.5],["C#5",.5],["B4",1],
    // phrase 2 answer — stepwise descent
    ["A4",.5],["B4",.5],["A4",1],["F#4",.5],["E4",.5],["D4",1],
    // pre-hook lift
    ["D5",.5],["D5",.5],["E5",1],["D5",.5],["B4",.5],["A4",1],
    ["B4",.5],["B4",.5],["D5",1],["C#5",.5],["B4",.5],["A4",1],
    // THE HOOK — big sustained shout
    ["D5",1],["E5",1],["F#5",1],["E5",1],
    // resolve / turnaround
    ["D5",1],["A4",1],["B4",1],["A4",1],
  ];
  const roots=["D2","A2","B2","G2","D2","A2","G2","A2"]; // D A Bm G | D A G A
  const bass=[];
  roots.forEach(r=>{ for(let i=0;i<8;i++) bass.push([r,.5]); }); // driving 8ths
  const chordTones={
    D2:["F#4","A4","D5"], A2:["E4","A4","C#5"],
    B2:["F#4","B4","D5"], G2:["G4","B4","D5"]
  };
  const harm=[];
  roots.forEach(r=>{ const t=chordTones[r]; for(let i=0;i<8;i++) harm.push([t[i%3],.5]); });
  const total=lead.reduce((s,n)=>s+n[1],0); // 32 beats
  return {bpm:178, lead, bass, harm, totalBeats:total, bars:8};
})();

const music={playing:false, enabled:true, master:null, loopDur:0, nextLoopTime:0, timer:null, NOISE:null};

function buildNoise(){
  const len=Math.floor(actx.sampleRate*0.5);
  const buf=actx.createBuffer(1,len,actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function pulse(freq,t,dur,vol,duty){ // square-ish pulse via PeriodicWave-free square
  if(!freq) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="square"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.setValueAtTime(vol*0.85,t+dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.95);
  o.connect(g); g.connect(music.master); o.start(t); o.stop(t+dur);
}
function triBass(freq,t,dur,vol){
  if(!freq) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="triangle"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.9);
  o.connect(g); g.connect(music.master); o.start(t); o.stop(t+dur);
}
function drumHit(t,kind){
  const src=actx.createBufferSource(); src.buffer=music.NOISE;
  const f=actx.createBiquadFilter(), g=actx.createGain();
  if(kind==="kick"){ // pitched low thump
    const o=actx.createOscillator(), og=actx.createGain();
    o.type="square"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(50,t+0.1);
    og.gain.setValueAtTime(0.18,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(og); og.connect(music.master); o.start(t); o.stop(t+0.13); return;
  }
  if(kind==="snare"){ f.type="bandpass"; f.frequency.value=1800; g.gain.setValueAtTime(0.12,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.12); }
  else { f.type="highpass"; f.frequency.value=7000; g.gain.setValueAtTime(0.05,t); // hat
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.04); }
  src.connect(f); f.connect(g); g.connect(music.master);
  src.start(t); src.stop(t+0.15);
}
function playLine(track,at,beat,voice){
  let t=at;
  for(const [note,dur] of track){ voice(noteFreq(note),t,dur*beat); t+=dur*beat; }
}
function scheduleSong(at){
  const beat=60/SONG.bpm, eighth=beat/2;
  playLine(SONG.lead, at, beat, (f,t,d)=>pulse(f,t,d,0.16));
  playLine(SONG.harm, at, beat, (f,t,d)=>pulse(f,t,d,0.05));
  playLine(SONG.bass, at, beat, (f,t,d)=>triBass(f,t,d,0.22));
  // drums: punk beat, 8 eighths/bar over 8 bars
  for(let bar=0;bar<SONG.bars;bar++){
    for(let e=0;e<8;e++){
      const t=at+(bar*8+e)*eighth;
      if(e===0||e===4) drumHit(t,"kick");
      if(e===2||e===6) drumHit(t,"snare");
      drumHit(t,"hat");
    }
  }
}
function musicTick(){
  if(!music.playing) return;
  while(music.nextLoopTime < actx.currentTime + 0.3){
    scheduleSong(music.nextLoopTime);
    music.nextLoopTime += music.loopDur;
  }
}
function startMusic(){
  if(music.playing || !music.enabled) return;
  try{
    ensureCtx();
    music.NOISE=music.NOISE||buildNoise();
    music.master=actx.createGain();
    music.master.gain.setValueAtTime(0.0001,actx.currentTime);
    music.master.gain.linearRampToValueAtTime(0.5,actx.currentTime+1.2); // gentle fade-in
    music.master.connect(actx.destination);
    music.loopDur=SONG.totalBeats*60/SONG.bpm;
    music.nextLoopTime=actx.currentTime+0.12;
    music.playing=true;
    music.timer=setInterval(musicTick,50);
    musicTick();
  }catch(e){ console.warn("music failed",e); }
}
function setMusicEnabled(on){
  music.enabled=on;
  const btn=$("muteBtn"); if(btn) btn.textContent=on?"🔊":"🔇";
  if(on){ if(!music.playing) startMusic();
          else if(music.master) music.master.gain.linearRampToValueAtTime(0.5,actx.currentTime+0.3); }
  else if(music.master){ music.master.gain.linearRampToValueAtTime(0.0001,actx.currentTime+0.2); }
}

/* ----- text typing ----- */
function typeText(str){
  if(window.__FAST){ $("textbox").textContent=str; return Promise.resolve(); }
  return new Promise(res=>{
    const box=$("textbox"); box.textContent="";
    let i=0;
    const t=setInterval(()=>{
      box.textContent=str.slice(0,++i);
      if(i%2===0) sfx.blip();
      if(i>=str.length){ clearInterval(t); setTimeout(res,260); }
    },22);
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,window.__FAST?0:ms));

/* ----- HP bar helpers ----- */
function hpColor(ratio){ return ratio>.5?"var(--hp-green)":ratio>.2?"var(--hp-yellow)":"var(--hp-red)"; }
function setHP(who){
  if(who==="me"){
    const r=meHP/me.hp; const el=$("meHp");
    el.style.width=Math.max(0,r*100)+"%"; el.style.background=hpColor(r);
    $("meHpNum").textContent=`${Math.max(0,Math.round(meHP))} / ${me.hp}`;
  }else{
    const r=foeHP/foe.hp; const el=$("foeHp");
    el.style.width=Math.max(0,r*100)+"%"; el.style.background=hpColor(r);
  }
}

/* ----- damage ----- */
function calcDamage(att,def,power){
  const ratio=att.atk/def.def;
  let dmg=(power*ratio*0.42)+2;
  const crit=Math.random()<1/16;
  if(crit) dmg*=1.85;
  dmg*=0.85+Math.random()*0.15;
  return {dmg:Math.max(1,Math.round(dmg)), crit};
}

/* ----- start a battle ----- */
function startBattle(chosen){
  me=chosen;
  const others=CHARS.filter(c=>c.id!==chosen.id);
  foe=others[Math.floor(Math.random()*others.length)];
  meHP=me.hp; foeHP=foe.hp;
  usedMoves={me:new Set(), foe:new Set()}; announced=new Set();

  renderChar($("meSprite"),me);
  renderChar($("foeSprite"),foe);
  $("meName").textContent=me.name; $("foeName").textContent=foe.name;
  setHP("me"); setHP("foe");
  buildMenu();
  $("menu").classList.remove("show");
  show("battle");
  introSequence();
}

/* ============================================================
   ATTACK FX ENGINE  — a unique animated effect + sound per move
   ============================================================ */
function fxCtx(){ return $("fxCanvas").getContext("2d"); }
function fxSize(){ const c=$("fxCanvas"); const r=c.getBoundingClientRect();
  c.width=Math.max(2,r.width|0); c.height=Math.max(2,r.height|0); }
function fxAnchors(side){
  const c=$("fxCanvas"), W=c.width, H=c.height;
  const meA={x:W*0.26,y:H*0.74}, foeA={x:W*0.76,y:H*0.34};
  return side==="me"?{src:meA,dst:foeA,W,H}:{src:foeA,dst:meA,W,H};
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function gdot(c,x,y,r,col,a){ c.save(); c.globalCompositeOperation="lighter"; c.globalAlpha=a;
  const g=c.createRadialGradient(x,y,0,x,y,Math.max(1,r)); g.addColorStop(0,col); g.addColorStop(1,hexA(col,0));
  c.fillStyle=g; c.beginPath(); c.arc(x,y,Math.max(1,r),0,7); c.fill(); c.restore(); }
function gline(c,x1,y1,x2,y2,w,col,a){ c.save(); c.globalAlpha=a; c.lineCap="round";
  c.lineWidth=w; c.strokeStyle=col; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.restore(); }
const lerp=(s,d,t)=>({x:s.x+(d.x-s.x)*t,y:s.y+(d.y-s.y)*t});

function fxSlash(c,p,col,d,n,W,H){ const len=W*0.13;
  for(let i=0;i<n;i++){ const t=Math.min(1,Math.max(0,(p-i*0.1)/0.45)); if(t<=0||t>=1) continue;
    const a=Math.sin(t*Math.PI), ang=-0.7+i*0.5;
    const ox=d.x+(i-(n-1)/2)*W*0.03, oy=d.y+(i-(n-1)/2)*H*0.03;
    const dx=Math.cos(ang)*len*t, dy=Math.sin(ang)*len*t;
    gline(c,ox-dx,oy-dy,ox+dx,oy+dy,H*0.018,col,a);
    gline(c,ox-dx,oy-dy,ox+dx,oy+dy,H*0.006,"#fff",a*0.9); } }
function fxImpact(c,p,col,d,W,H){ const a=1-p, r=H*0.02+p*H*0.16;
  gdot(c,d.x,d.y,r*0.8,col,a*0.7); c.save(); c.globalAlpha=a; c.strokeStyle="#fff"; c.lineWidth=H*0.01;
  c.beginPath(); c.arc(d.x,d.y,r,0,7); c.stroke();
  for(let i=0;i<8;i++){ const ang=i*Math.PI/4; gline(c,d.x,d.y,d.x+Math.cos(ang)*r*1.4,d.y+Math.sin(ang)*r*1.4,H*0.008,col,a); }
  c.restore(); }
function fxPunch(c,p,col,s,d,W,H){
  if(p<0.5){ const t=p/0.5, x=s.x+(d.x-s.x)*t, y=s.y+(d.y-s.y)*t;
    gline(c,s.x,s.y,x,y,H*0.02,col,0.5); gdot(c,x,y,H*0.05,col,0.8); }
  else{ const t=(p-0.5)/0.5, a=1-t, r=H*0.04+t*H*0.12; gdot(c,d.x,d.y,r,col,a);
    c.save(); c.globalAlpha=a; c.strokeStyle="#fff"; c.lineWidth=H*0.012;
    for(const ang of [0,Math.PI/2,Math.PI,3*Math.PI/2]){ c.beginPath(); c.moveTo(d.x,d.y);
      c.lineTo(d.x+Math.cos(ang)*r*1.5,d.y+Math.sin(ang)*r*1.5); c.stroke(); } c.restore(); } }
function fxFlurry(c,p,col,s,d,W,H){
  for(let i=0;i<10;i++){ const tp=p*10-i; if(tp<0||tp>1) continue; const a=1-tp, seed=i*97;
    const x=d.x+((seed%7)-3)*W*0.02, y=d.y+(((seed*3)%7)-3)*H*0.02;
    gdot(c,x,y,H*0.04,col,a*0.9); gline(c,x-8,y,x+8,y,H*0.006,"#fff",a); } }
function fxFire(c,p,col,s,d,W,H){
  if(p<0.55){ const t=p/0.55, x=s.x+(d.x-s.x)*t, y=s.y+(d.y-s.y)*t;
    gdot(c,x,y,H*0.06,col,0.95); gdot(c,x,y,H*0.1,"#ffd23f",0.4);
    for(let k=1;k<4;k++){ const tt=Math.max(0,t-k*0.06), xx=s.x+(d.x-s.x)*tt, yy=s.y+(d.y-s.y)*tt; gdot(c,xx,yy,H*0.04/k,col,0.4/k); } }
  else{ const t=(p-0.55)/0.45, a=1-t, r=H*0.05+t*H*0.18; gdot(c,d.x,d.y,r,col,a); gdot(c,d.x,d.y,r*0.6,"#ffd23f",a*0.8);
    for(let i=0;i<6;i++){ const ang=i*Math.PI/3+t; gline(c,d.x,d.y,d.x+Math.cos(ang)*r,d.y+Math.sin(ang)*r,H*0.01,"#ff9a3a",a); } } }
function fxBeam(c,p,col,s,d,W,H){ c.save(); c.globalCompositeOperation="lighter";
  if(p<0.3){ const t=p/0.3; gdot(c,s.x,s.y,H*0.02+t*H*0.06,col,0.9); }
  else{ const t=(p-0.3)/0.7, a=t<0.7?1:(1-(t-0.7)/0.3), grow=Math.min(1,t/0.3), e=lerp(s,d,grow);
    gline(c,s.x,s.y,e.x,e.y,H*0.06,col,a*0.7); gline(c,s.x,s.y,e.x,e.y,H*0.025,"#fff",a*0.9); gdot(c,e.x,e.y,H*0.09,col,a); }
  c.restore(); }
function fxOrb(c,p,col,s,d,W,H){ c.save(); c.globalCompositeOperation="lighter";
  if(p<0.4){ const t=p/0.4, r=H*0.1*(1-t*0.4); gdot(c,s.x,s.y,r,col,0.8);

function fxSpark(c,p,col,d,W,H){ for(let i=0;i<12;i++){ const ang=i*0.7+p*3, rr=H*0.04+(i%3)*H*0.03+p*H*0.06;

function fxNet(c,p,col,d,W,H){ const a=Math.sin(p*Math.PI), R=H*0.04+p*H*0.13; c.save(); c.globalAlpha=a; c.strokeStyle=col; c.lineWidth=2;

function fxBlackflash(c,p,col,s,d,W,H){

function fxNails(c,p,col,d,W,H){ for(let i=0;i<8;i++){ const t=p*1.3-(i%4)*0.08; if(t<0||t>1) continue;

function animateFx(key,color,side){
  if(window.__FAST) return Promise.resolve();
  const fn=FX[key]||FX.impact, ctx=fxCtx(); fxSize();
  const {src,dst,W,H}=fxAnchors(side), dur=key==="domain"?900:key==="hollow"?1050:540;
  return new Promise(res=>{
    const t0=performance.now();
    (function frame(now){
      const p=Math.min(1,(now-t0)/dur);
      ctx.clearRect(0,0,W,H);
      try{ fn(ctx,p,color,src,dst,W,H); }catch(e){}
      if(p<1) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); res(); }
    })(t0);
  });
}

/* ---- per-move sound: family timbre + per-move pitch variation ---- */
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function aTone(f0,f1,t0,dur,type,vol){ const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t0); if(f1!=null) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+0.02); }
function aNoise(t0,dur,filt,freq,vol,Q){ const s=actx.createBufferSource(); s.buffer=music.NOISE;
  const f=actx.createBiquadFilter(); f.type=filt; f.frequency.value=freq; if(Q) f.Q.value=Q;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t0); s.stop(t0+dur+0.02); }
const SND={
  swipe:(d)=>{ const t=actx.currentTime; aNoise(t,0.18,"bandpass",1200+d*120,0.14,1.5); aTone(900+d*60,300,t,0.16,"sawtooth",0.05); },
  thud:(d)=>{ const t=actx.currentTime; aTone(180+d*10,50,t,0.16,"square",0.16); aNoise(t,0.08,"lowpass",400,0.1); },
  flurry:()=>{ for(let i=0;i<6;i++){ const t=actx.currentTime+i*0.05; aTone(220+(i%2)*120,90,t,0.06,"square",0.08); } },
  quake:()=>{ const t=actx.currentTime; aTone(90,40,t,0.5,"square",0.2); aNoise(t,0.4,"lowpass",200,0.14); },
  fire:()=>{ const t=actx.currentTime; aNoise(t,0.35,"highpass",800,0.12); aTone(140,60,t,0.3,"sawtooth",0.08); },
  air:(d)=>{ const t=actx.currentTime; aNoise(t,0.3,"bandpass",2200+d*200,0.1,0.7); },
  shimmer:(d)=>{ for(let i=0;i<5;i++){ const t=actx.currentTime+i*0.05; aTone(1400+i*200+d*50,null,t,0.08,"triangle",0.05); } },
  beam:(d)=>{ const t=actx.currentTime; aTone(200,1200+d*80,t,0.18,"sawtooth",0.06);
    aTone(1200,300,t+0.15,0.35,"square",0.1); aNoise(t+0.15,0.3,"bandpass",900,0.08,0.8); },
  zap:()=>{ const t=actx.currentTime; aTone(2400,600,t,0.12,"sawtooth",0.1); aNoise(t,0.12,"highpass",3000,0.12); },
  crack:()=>{ const t=actx.currentTime; aNoise(t,0.12,"bandpass",1600,0.18,2); aTone(120,40,t,0.18,"square",0.16); },
  dark:(d)=>{ const t=actx.currentTime; aTone(140+d*8,60,t,0.3,"triangle",0.1); aNoise(t,0.25,"lowpass",600,0.08); },
  blip:(d,h)=>{ for(let i=0;i<5;i++){ const t=actx.currentTime+i*0.04; aTone(1200+(h%5)*100-i*80,null,t,0.04,"square",0.06); } },
  shield:()=>{ const t=actx.currentTime; aTone(900,1300,t,0.1,"triangle",0.08); aTone(1300,null,t+0.08,0.18,"triangle",0.06); },
  boom:()=>{ const t=actx.currentTime; aTone(70,30,t,0.7,"square",0.2); aTone(400,120,t,0.5,"sawtooth",0.06); aNoise(t,0.5,"lowpass",300,0.1); },
  hollow:()=>{ const t=actx.currentTime; // blue + red charge converging, then erasing boom
    aTone(280,720,t,0.42,"sine",0.07); aTone(1000,520,t,0.42,"sawtooth",0.06);
    aTone(700,80,t+0.45,0.55,"square",0.18); aTone(380,90,t+0.45,0.5,"sawtooth",0.07); aNoise(t+0.45,0.55,"lowpass",420,0.12); },
};
const SND_FAMILY={ slash:"swipe",slash3:"swipe",slash5:"swipe",odm:"swipe",odmspin:"swipe",claw:"swipe",claw3:"swipe",bite:"swipe",
  punch:"thud",kick:"thud",impact:"thud",flurry:"flurry",titan:"quake",
  fire:"fire",steam:"air",wind:"air",spark:"shimmer",
  beam:"beam",orb:"beam",orbRed:"beam",spear:"beam",hollow:"hollow",
  lightning:"zap",blackflash:"crack",shadow:"dark",net:"dark",
  projectile:"blip",nails:"blip",shield:"shield",domain:"boom" };
function playMoveSound(key,name){
  try{ ensureCtx(); if(!music.NOISE) music.NOISE=buildNoise();
    const h=hashStr(name||""), d=(h%7)-3; (SND[SND_FAMILY[key]||"thud"])(d,h);
  }catch(e){}
}

function buildMenu(){
  const menu=$("menu"); menu.innerHTML="";
  me.moves.forEach(mv=>{
    const b=document.createElement("button");
    b.className="move"; b.textContent=mv.n; b._move=mv;
    b.onclick=()=>chooseMove(mv);
    menu.appendChild(b);
  });
}

async function playerTurn(){
  busy=false;
  // announce any move that just became unlocked (e.g. Hollow Purple)
  const justUnlocked=[];
  for(const mv of me.moves){
    if(mv.req && !announced.has(mv.n) && !isLocked(mv,"me")){
      announced.add(mv.n); justUnlocked.push(mv);
      sfx.unlock();
      await typeText(`Blue and Red become one — ${mv.n} is ready!`);
    }
  }
  setMenuEnabled(true);
  await typeText(`What will ${me.name} do?`);
  $("menu").classList.add("show");
  // glow the freshly-unlocked move button(s)
  for(const mv of justUnlocked){
    const btn=[...$("menu").children].find(b=>b._move===mv);
    if(btn){ btn.classList.remove("unlock-glow"); void btn.offsetWidth; btn.classList.add("unlock-glow"); }
  }
}

function setMenuEnabled(on){
  [...$("menu").children].forEach(b=>{
    const mv=b._move;
    const locked = on && isLocked(mv,"me");
    b.disabled = !on || locked;
    b.classList.toggle("locked", locked);
    b.textContent = (locked?"🔒 ":"")+mv.n;
  });
}

async function chooseMove(move){
  if(busy) return; busy=true;
  $("menu").classList.remove("show");
  setMenuEnabled(false);

  // foe never picks a move it hasn't unlocked yet
  const foePool=foe.moves.filter(m=>!isLocked(m,"foe"));
  const foeMove=foePool[Math.floor(Math.random()*foePool.length)];
  // turn order by speed
  const meFirst = me.spd>=foe.spd;
  const actions = meFirst
    ? [["me",move],["foe",foeMove]]
    : [["foe",foeMove],["me",move]];

  for(const [side,mv] of actions){
    if(meHP<=0||foeHP<=0) break;
    await doAttack(side,mv);
  }

  if(meHP<=0||foeHP<=0){ endBattle(); return; }
  playerTurn();
}

async function doAttack(side,mv){
  const {n:mvName,p:mvPow,fx:fxKey,c:color,x:flag}=mv;
  usedMoves[side].add(mvName); // track for combo unlocks (e.g. Hollow Purple)
  const att = side==="me"?me:foe;
  const def = side==="me"?foe:me;
  await typeText(`${att.name} used ${mvName}!`);

  // OHKO move (Haddon's request: Luffy's Kamehameha one-shots any opponent)
  let dmg, crit=false;
  if(flag==="ohko"){
    await typeText("A devastating wave of energy erupts!");
    dmg = (side==="me"?foeHP:meHP); // exactly lethal — drops target to 0
  }else{
    ({dmg,crit}=calcDamage(att,def,mvPow));
  }

  // animate attacker lunge
  const attSpr = side==="me"?$("meSprite"):$("foeSprite");
  const defSpr = side==="me"?$("foeSprite"):$("meSprite");
  const baseT = side==="me"?"scaleX(-1)":"";
  const lunge = side==="me" ? "translate(-8px,-6px)" : "translate(8px,-6px)";
  attSpr.style.transform = baseT+" "+lunge;
  await wait(120);
  attSpr.style.transform = baseT;

  // unique attack effect + sound for this move
  playMoveSound(fxKey,mvName);
  const fxDone = animateFx(fxKey,color,side);
  await wait(fxKey==="domain"?420:fxKey==="hollow"?760:200); // let the effect travel/land
  if(crit) sfx.crit();
  defSpr.classList.add("flash"); defSpr.classList.add("shake");

  if(side==="me"){ foeHP=Math.max(0,foeHP-dmg); setHP("foe"); }
  else{ meHP=Math.max(0,meHP-dmg); setHP("me"); }

  await wait(300);
  defSpr.classList.remove("flash"); defSpr.classList.remove("shake");
  await fxDone;

  if(crit) await typeText("A critical hit!");
}

async function endBattle(){
  const win = foeHP<=0;
  const loser = win?$("foeSprite"):$("meSprite");
  const loserName = win?foe.name:me.name;

  await typeText(`${loserName} fainted!`);
  sfx.faint();
  loser.style.opacity=0; loser.style.transform=(loser.id==="meSprite"?"scaleX(-1) ":"")+"translateY(40px)";

  await wait(500);
  const toast=$("toast");
  if(win){ sfx.win(); toast.textContent=`🏆 ${me.name} WINS!`; }
  else{ toast.textContent=`💀 ${me.name} was defeated…`; }
  toast.classList.add("show");
  await typeText(win?`${me.name} won the duel!`:`${me.name} is out of the fight…`);
  await typeText("Tap anywhere to choose again.");

  const back=()=>{
    document.removeEventListener("click",back);
    toast.classList.remove("show");
    // reset sprite transforms
    $("meSprite").style.transform="scaleX(-1)"; $("meSprite").style.opacity=1;
    $("foeSprite").style.transform=""; $("foeSprite").style.opacity=1;
    show("select");
  };
  setTimeout(()=>document.addEventListener("click",back),400);
}
</script>
</body>
